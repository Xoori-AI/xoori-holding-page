<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xoori — back soon</title>
<meta name="description" content="Xoori Fit is taking a short break. We'll be back soon.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Solway:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Xoori holding site — tokens from Xoori-MVP/DESIGN.md */
:root {
  --bg: #f8f6f3;
  --surface: #ffffff;
  --text: #1f2937;
  --muted: #6b7280;
  --accent: #2d6a5f;
  --accent-hover: #234d44;
  --border: #e5e7eb;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Solway", Georgia, serif;
  font-weight: 400;
  font-size: 16px;
  line-height: 1.6;
}
a { color: var(--accent); text-underline-offset: 3px; }
a:hover { color: var(--accent-hover); }

.wordmark {
  font-weight: 800;
  letter-spacing: 6px;
  font-size: 20px;
  color: var(--text);
  text-decoration: none;
}

/* Holding page */
.hold {
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  max-width: 1200px;
  margin: 0 auto;
  padding: 32px 16px;
}
.hold header { padding: 0 0 16px; }
.hold-main {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  max-width: 640px;
  padding: 64px 0;
}
.eyebrow {
  font-weight: 600;
  font-size: 13px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--accent);
  margin: 0 0 16px;
}
.hold h1 {
  font-weight: 800;
  font-size: clamp(2.25rem, 6vw, 3rem);
  line-height: 1.1;
  margin: 0 0 24px;
}
.lede { font-size: 1.25rem; font-weight: 500; margin: 0 0 48px; max-width: 34ch; }
.notify {
  border-top: 1px solid var(--border);
  padding-top: 24px;
  color: var(--muted);
  margin: 0;
}
.notify a { font-weight: 600; overflow-wrap: anywhere; }

footer {
  border-top: 1px solid var(--border);
  padding-top: 16px;
  font-size: 14px;
  color: var(--muted);
  display: flex;
  flex-wrap: wrap;
  gap: 8px 24px;
}
footer a { color: var(--muted); }
footer a:hover { color: var(--accent); }

/* Legal pages */
.legal { max-width: 760px; margin: 0 auto; padding: 32px 16px 48px; }
.legal header { padding-bottom: 24px; }
.notice {
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  border-radius: 8px;
  padding: 12px 16px;
  font-size: 14px;
  color: var(--muted);
  margin: 0 0 32px;
}
.legal main {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 32px 24px;
  margin-bottom: 32px;
  overflow-wrap: anywhere;
}
.legal h1 { font-weight: 800; font-size: 2rem; line-height: 1.2; margin: 0 0 8px; }
.legal h2 { font-weight: 700; font-size: 1.25rem; margin: 32px 0 8px; }
.legal h3 { font-weight: 700; font-size: 1rem; margin: 24px 0 8px; }
.legal ul { padding-left: 20px; }
.legal li { margin-bottom: 6px; }
.legal blockquote {
  margin: 16px 0;
  padding: 12px 16px;
  background: var(--bg);
  border-left: 3px solid var(--accent);
  border-radius: 4px;
}
.legal main > div > div > a { margin-right: 24px; }
</style>
</head>
<body>
<div class="hold">
  <header><a class="wordmark" href="./">XOORI</a></header>
  <main class="hold-main">
    <p class="eyebrow">Xoori Fit</p>
    <h1>We're taking a short break.</h1>
    <p class="lede">We're rebuilding, and we'll be back soon.</p>
    <p class="notify">Want to know when we're back? Email <a href="mailto:nlutta@xoori.ai?subject=Tell%20me%20when%20Xoori%20is%20back">nlutta@xoori.ai</a></p>
  </main>
  <footer>
    <span>Xoori, Inc. · Cambridge, MA</span>
    <a href="./privacy/">Privacy</a>
    <a href="./terms/">Terms</a>
    <a href="./sms-consent/">SMS Terms</a>
  </footer>
</div>
</body>
</html>
